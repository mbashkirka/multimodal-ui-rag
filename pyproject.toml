[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-rag"
version = "0.10.0.1"
description = "Portfolio-ready multimodal UI RAG with measured retrieval, grounded local VLM generation, resilient FastAPI serving, evaluation, metrics, and CI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faiss-cpu==1.11.0.post1",
    "numpy>=1.26,<3",
    "open-clip-torch==3.3.0",
    "pillow>=10,<12",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "tqdm>=4.66,<5",
    "transformers==5.15.1",
]

[project.optional-dependencies]
rag = [
    "mlx-vlm==0.6.8",
]
api = [
    "fastapi==0.162.0",
    "uvicorn==0.52.4",
]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.3",
    "httpx2==2.12.0",
]

[project.scripts]
ui-rag = "ui_rag.cli:main"
ui-rag-api = "ui_rag.api.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::ResourceWarning",
]
